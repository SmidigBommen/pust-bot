services:
  app:
    build:
      context: .
      target: development
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /app/data/pust.sqlite
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pust_data:/app/data
    init: true
    restart: unless-stopped

volumes:
  node_modules:
  pust_data:

