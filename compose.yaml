services:
  app:
    build:
      context: .
      target: development
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /app/data/pust.sqlite
      PUST_WEEKLY_RECAP_ENABLED: "false"
      PUST_ARCHIVE_ENABLED: "true"
      PUST_PUBLIC_URL: http://localhost:3000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pust_data:/app/data
    init: true
    restart: unless-stopped

volumes:
  node_modules:
  pust_data:
